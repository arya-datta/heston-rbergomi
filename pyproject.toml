[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volengine"
version = "0.1.0"
description = "Heston / rough Bergomi volatility modeling engine with OpenBB-driven backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Heston Vol Engine" }]
# Upper bounds guard against silent major-version breakage. numpy<3 is
# explicit because numpy 2.0 already removed np.trapz once and broke this
# package; the next major could do the same.
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.11,<2",
    "pandas>=2.0,<4",
    "matplotlib>=3.7",
    "numba>=0.58",
    "openbb>=4.3",
    "pyarrow>=14.0",
    "python-dateutil>=2.8",
    "tqdm>=4.66",
]

[project.scripts]
volengine-benchmark-svi = "volengine.scripts.benchmark_svi_25bps:main"
volengine-generate-headline = "volengine.scripts.generate_headline_plot:main"
volengine-backtest = "volengine.backtesting.run_backtest:main"

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "jupyter>=1.0", "ipykernel>=6.25"]
neural = ["torch>=2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take > ~10s; deselect with `pytest -m 'not slow'`",
    "live: tests that hit a live network/data provider; deselect by default",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors; I: import sorting; UP: pyupgrade;
# B: bugbear (catches e.g. mutable defaults, bare except misuse);
# NPY: numpy-specific lints (would have flagged the np.trapz removal).
select = ["E", "F", "I", "UP", "B", "NPY"]
ignore = [
    "E501",   # line length handled by formatter, not enforced hard
    "B008",   # function calls in argument defaults (np.array(...) defaults)
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]   # imports after prose cells
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true   # openbb / numba have partial stubs
warn_unused_ignores = true
# Not --strict yet: the codebase is fully type-hinted but third-party stubs
# are incomplete. Run `mypy src/volengine` for a best-effort check.
