name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  fast:
    name: Fast tests (no slow / live)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (without openbb / torch)
        run: |
          python -m pip install --upgrade pip
          # Install the minimum dependency closure for the fast test subset.
          # openbb pulls a huge tree and is only needed for `live` tests;
          # torch is only needed for the neural stretch.
          pip install "numpy>=1.24,<3" "scipy>=1.11,<2" "pandas>=2.0,<4" \
                      "matplotlib>=3.7" "numba>=0.58" "python-dateutil>=2.8" \
                      "pyarrow>=14.0" "tqdm>=4.66" \
                      "pytest>=7.4" "pytest-cov>=4.1" "ruff>=0.6"
          pip install -e . --no-deps

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Run fast tests
        run: |
          pytest -m "not slow and not live" -v --tb=short --cov=volengine --cov-report=term

  slow:
    name: Slow tests (Heston/rBergomi calibration + MC)
    runs-on: ubuntu-latest
    needs: fast
    # Run slow tests only on main pushes — keeps PR CI under 1 minute.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24" "scipy>=1.11" "pandas>=2.0" \
                      "matplotlib>=3.7" "numba>=0.58" "python-dateutil>=2.8" \
                      "pyarrow>=14.0" "tqdm>=4.66" \
                      "pytest>=7.4" "pytest-cov>=4.1"
          pip install -e . --no-deps

      - name: Run slow tests
        run: pytest -m "slow" -v --tb=short
